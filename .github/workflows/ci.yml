name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # The Dockerfile's Node minor. When Dependabot's pull request moves the
      # Dockerfile's minor, change this line in that pull request by hand; CI
      # fails until both name the same minor. check-latest takes the newest
      # patch; without it, an older patch cached on the runner would do.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22'
          check-latest: true
      - name: Check that CI runs the image's Node minor
        shell: bash
        run: |
          image="$(sed -n 's/^FROM node:\([0-9]*\.[0-9]*\)-alpine .*/\1/p' Dockerfile | sort -u)"
          ci="$(node -p 'process.versions.node.split(".").slice(0, 2).join(".")')"
          if [ "$image" != "$ci" ]; then
            echo "::error::The Dockerfile names Node $image; CI runs $ci. Change node-version in ci.yml and release.yml."
            exit 1
          fi

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test

  # Builds the runtime image (never pushed) and runs it: see the script for
  # what it checks.
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime image
        run: docker build --target runtime --tag auth-proxy:ci .
      - name: Run the image
        run: .github/scripts/image-smoke.sh auth-proxy:ci
