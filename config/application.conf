http {
  hostname = "0.0.0.0"
  hostname = ${?HTTP_HOSTNAME}
  port = 80
  port = ${?HTTP_PORT}
  pathPrefix = "/"
  pathPrefix = ${?HTTP_PATH_PREFIX}
  bodyLimitSize = "10mb"
  bodyLimitSize = ${?HTTP_BODY_LIMIT_SIZE}
  cors {
    origin {
      pattern = null
      pattern = ${?CORS_ORIGIN_PATTERN}
    }
  }
}

auth {
  # Required. No default — must be set explicitly via HOCON or AUTH_MODE env.
  # Accepted: "validation" | "injection"
  mode = null
  mode = ${?AUTH_MODE}

  validation {
    client {
      clientId = null
      clientId = ${?CLIENT_ID}
      clientSecret = null
      clientSecret = ${?CLIENT_SECRET}
    }
    introspect {
      url = "http://localhost:3000/oauth/introspect"
      url = ${?INTROSPECT_URL}
      cacheTtlSec = 30
      cacheTtlSec = ${?INTROSPECT_CACHE_TTL_SEC}
      cacheMaxEntries = 10000
      cacheMaxEntries = ${?INTROSPECT_CACHE_MAX_ENTRIES}
      timeoutMs = 5000
      timeoutMs = ${?INTROSPECT_TIMEOUT_MS}
    }
  }

  injection {
    providerOrigin = "http://localhost:3000"
    providerOrigin = ${?INJECTION_PROVIDER_ORIGIN}
    clientId = ""
    clientId = ${?INJECTION_CLIENT_ID}
    scope = ""
    scope = ${?INJECTION_SCOPE}
    sessionCookieName = "connect.sid"
    sessionCookieName = ${?INJECTION_SESSION_COOKIE_NAME}
    tokenCache {
      ttlSeconds = 60
      ttlSeconds = ${?INJECTION_TOKEN_CACHE_TTL_SEC}
      maxEntries = 10000
      maxEntries = ${?INJECTION_TOKEN_CACHE_MAX_ENTRIES}
      safetyMarginSeconds = 5
      safetyMarginSeconds = ${?INJECTION_TOKEN_CACHE_SAFETY_MARGIN_SEC}
    }
    timeoutMs = 5000
    timeoutMs = ${?INJECTION_TIMEOUT_MS}
  }
}

upstream {
  baseURL = "http://localhost:3000"
  baseURL = ${?UPSTREAM_BASEURL}
}
