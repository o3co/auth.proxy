http {
  hostname = "0.0.0.0"
  hostname = ${?HTTP_HOSTNAME}
  port = 80
  port = ${?HTTP_PORT}
  pathPrefix = "/"
  pathPrefix = ${?HTTP_PATH_PREFIX}
}

introspect {
  url = "http://localhost:3000/oauth/introspect"
  url = ${?INTROSPECT_URL}
  cacheTtlSec = 30
  cacheTtlSec = ${?INTROSPECT_CACHE_TTL_SEC}
}

endpoint {
  baseURL = "http://localhost:3000"
  baseURL = ${?ENDPOINT_BASEURL}
}

proxy {
  bodyLimitSize = "10mb"
  bodyLimitSize = ${?PROXY_BODY_LIMIT_SIZE}
}

cors {
  origin {
    pattern = null
    pattern = ${?CORS_ORIGIN_PATTERN}
  }
}
