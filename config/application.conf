http {
  hostname = "0.0.0.0"
  hostname = ${?HTTP_HOSTNAME}
  port = 80
  port = ${?HTTP_PORT}
  pathPrefix = "/"
  pathPrefix = ${?HTTP_PATH_PREFIX}
  bodyLimitSize = "10mb"
  bodyLimitSize = ${?HTTP_BODY_LIMIT_SIZE}
  cors {
    origin {
      pattern = null
      pattern = ${?CORS_ORIGIN_PATTERN}
    }
  }
}

auth {
  # Required. No default — must be set explicitly via HOCON or AUTH_MODE env.
  # Accepted: "validation" | "injection"
  mode = null
  mode = ${?AUTH_MODE}

  validation {
    # RFC 6750 realm for the WWW-Authenticate challenge. Unset (null or ""):
    # no realm, and a request using another auth scheme gets no challenge.
    realm = null
    realm = ${?VALIDATION_REALM}
    client {
      clientId = null
      clientId = ${?CLIENT_ID}
      clientSecret = null
      clientSecret = ${?CLIENT_SECRET}
    }
    introspect {
      url = "http://localhost:3000/oauth/introspect"
      url = ${?INTROSPECT_URL}
      cacheTtlSec = 30
      cacheTtlSec = ${?INTROSPECT_CACHE_TTL_SEC}
      cacheMaxEntries = 10000
      cacheMaxEntries = ${?INTROSPECT_CACHE_MAX_ENTRIES}
      timeoutMs = 5000
      timeoutMs = ${?INTROSPECT_TIMEOUT_MS}
    }
  }

  injection {
    providerOrigin = "http://localhost:3000"
    providerOrigin = ${?INJECTION_PROVIDER_ORIGIN}
    clientId = ""
    clientId = ${?INJECTION_CLIENT_ID}
    scope = ""
    scope = ${?INJECTION_SCOPE}
    sessionCookieName = "connect.sid"
    sessionCookieName = ${?INJECTION_SESSION_COOKIE_NAME}
    # Drop an inbound Authorization header on a request this proxy did not mint
    # a token for (no session cookie, or a refused one). Default false = forward
    # it untouched, which is what every deployment before this flag ran on.
    stripInboundAuthorization = false
    stripInboundAuthorization = ${?INJECTION_STRIP_INBOUND_AUTHORIZATION}
    tokenCache {
      ttlSeconds = 60
      ttlSeconds = ${?INJECTION_TOKEN_CACHE_TTL_SEC}
      maxEntries = 10000
      maxEntries = ${?INJECTION_TOKEN_CACHE_MAX_ENTRIES}
      safetyMarginSeconds = 5
      safetyMarginSeconds = ${?INJECTION_TOKEN_CACHE_SAFETY_MARGIN_SEC}
    }
    timeoutMs = 5000
    timeoutMs = ${?INJECTION_TIMEOUT_MS}
    # Exchange an inbound `Authorization: Bearer <JWT>` for a first-party token
    # at the provider's token endpoint (RFC 7523 jwt-bearer). Off by default;
    # when off, nothing below is used. When on, clientId and clientSecret are
    # required (client_secret_basic).
    exchange {
      enabled = false
      enabled = ${?INJECTION_EXCHANGE_ENABLED}
      clientId = null
      clientId = ${?INJECTION_EXCHANGE_CLIENT_ID}
      clientSecret = null
      clientSecret = ${?INJECTION_EXCHANGE_CLIENT_SECRET}
      # Sent to the token endpoint only when set.
      scope = null
      scope = ${?INJECTION_EXCHANGE_SCOPE}
      audience = null
      audience = ${?INJECTION_EXCHANGE_AUDIENCE}
      resource = null
      resource = ${?INJECTION_EXCHANGE_RESOURCE}
      # Optional prefilter on the unverified `iss`; empty = off. From the
      # environment: whitespace-separated.
      allowedIssuers = []
      allowedIssuers = ${?INJECTION_EXCHANGE_ALLOWED_ISSUERS}
    }
  }
}

upstream {
  baseURL = "http://localhost:3000"
  baseURL = ${?UPSTREAM_BASEURL}
}
